name = "jellytracks"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

# KV namespace for track metadata
# Create with: npx wrangler kv:namespace create TRACKS_KV
# Then replace the id below with the output value
[[kv_namespaces]]
binding = "TRACKS_KV"
id = "fc192ec5e9804a12a08bc2b863ca64ce"

# R2 bucket for video and thumbnail files
# Create with: npx wrangler r2 bucket create jellytracks-videos
[[r2_buckets]]
binding = "TRACKS_R2"
bucket_name = "jellytracks-videos"

[vars]
CF_ACCOUNT_ID = "d5569ff9882220fd7700c1796a8eac24"

# Secrets — set via: npx wrangler pages secret put <NAME>
# R2_PUBLIC_URL       - public base URL of R2 bucket (e.g. https://pub-xxx.r2.dev)
# DELETE_PASSWORD     - password to delete tracks
# R2_ACCESS_KEY_ID    - R2 API token Access Key ID (for presigned upload URLs)
# R2_SECRET_ACCESS_KEY - R2 API token Secret Access Key
