<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JellyTracks - Karaoke Track Library</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="/" class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="white"><path d="M12 2C8 2 4 5 4 9c0 3 2 5.5 4 7v2a1 1 0 001 1h6a1 1 0 001-1v-2c2-1.5 4-4 4-7 0-4-4-7-8-7zm-2 16v-1h4v1h-4zm5.5-3.5C14 16 13 16.5 12 16.5s-2-.5-3.5-2C7 13 6 11 6 9c0-3.3 2.7-5 6-5s6 1.7 6 5c0 2-1 4-2.5 5.5z"/></svg>
      </div>
      <span class="logo-text">JellyTracks</span>
    </a>

    <div class="search-wrap">
      <input type="text" id="searchInput" class="search-bar" placeholder="Search by song title or artist..." autocomplete="off">
      <button class="search-btn" id="searchBtn" aria-label="Search">
        <svg viewBox="0 0 24 24" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>

    <a href="/upload.html" class="upload-btn">
      <svg viewBox="0 0 24 24" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      <span>Upload</span>
    </a>
  </div>
</header>

<main>
  <section class="hero" id="heroSection">
    <h1 class="hero-title">Karaoke Track Library</h1>
    <p class="hero-subtitle">Search and play tracks for your live stream</p>
  </section>

  <section class="tracks-section">
    <div class="tracks-header">
      <h2 id="sectionTitle">All Tracks</h2>
      <span id="trackCount" class="track-count" hidden></span>
    </div>

    <div class="tracks-grid" id="tracksGrid" hidden></div>

    <div class="empty-state" id="emptyState" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <p id="emptyMessage">No tracks found</p>
      <small id="emptyHint">Try a different search term</small>
    </div>

    <div class="loading-spinner" id="loadingSpinner">
      <div class="spinner"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  JellyTracks &mdash; Karaoke for live streamers
</footer>

<script src="/js/main.js"></script>
</body>
</html>
